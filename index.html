<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>el fin (álbum 💜)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#5f3dc4;--tc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--x:0}}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tc);font:500 20px/1.45 "DM Sans",system-ui,sans-serif;transition:background .9s,color .9s;overflow-x:hidden}
main{max-width:520px;margin:auto;padding:18px 24px 170px;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;font:700 12px "Unbounded",sans-serif;opacity:.75;padding-top:6px;letter-spacing:.02em}
.tr{display:none}.tr.on{display:block;animation:up .7s both}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
.disc{position:relative;width:min(66vw,290px);aspect-ratio:1;margin:26px auto 22px;border-radius:50%;background:repeating-radial-gradient(circle,#0b0b0e 0 3px,#1c1c22 3px 5px);box-shadow:0 24px 50px #0007;animation:spin 7s linear infinite}
.disc:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff0 0 20%,#fff2 25%,#fff0 30% 70%,#fff2 75%,#fff0 80%)}
.disc img,.disc .lb{position:absolute;inset:27%;width:46%;height:46%;border-radius:50%;object-fit:cover;border:4px solid #fff;z-index:1}
.disc .lb{display:grid;place-content:center;background:#f4f1ea;font-size:44px;color:#000}
.disc:before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--bg);z-index:3;box-shadow:0 0 0 3px #fff}
.sticker{position:absolute;right:-6%;bottom:-4%;width:34%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #fff;z-index:4;box-shadow:0 8px 20px #0006;animation:spin 7s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.stop .disc{animation:none;transform:rotate(-8deg);filter:grayscale(1) contrast(1.1)}
h1,h2{font:900 clamp(32px,10vw,50px)/1 Unbounded,sans-serif;letter-spacing:-.03em;margin:0 0 6px}
.by{font-weight:700;opacity:.8;margin:0 0 22px}
.ly p{margin:0 0 10px;font-weight:700;font-size:clamp(21px,5.6vw,26px);line-height:1.25;opacity:0;animation:li 1s both;animation-delay:var(--d)}
@keyframes li{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.static{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.5'/></svg>");animation:st .25s steps(4) infinite}
body.lost .static{opacity:.35}
@keyframes st{25%{background-position:-40px 30px}50%{background-position:60px -50px}75%{background-position:-20px -70px}}
.lostt h2{animation:gl 2.5s infinite}
@keyframes gl{0%,90%,100%{text-shadow:none;transform:none}92%{text-shadow:4px 0 #f03e3e,-4px 0 #22b8cf;transform:translateX(3px)}95%{text-shadow:-4px 0 #f03e3e,4px 0 #22b8cf;transform:translateX(-3px)}}
.card{background:#fffaf0;color:#2b2430;border-radius:22px;padding:24px 22px;margin-top:20px;box-shadow:0 18px 40px #0005}
.card p{margin:0 0 14px;font-size:19px;font-weight:500}.card .sg{font:900 22px Unbounded;color:#5f3dc4;margin:0}
.xtra{display:none;margin-top:16px;font-weight:700}.xtra.show{display:block;animation:up .6s both}
.pl{border:0;background:#2b2430;color:#fff;font:700 15px "DM Sans";border-radius:99px;padding:12px 20px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 24px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0000,#0006)}
.pb{max-width:520px;margin:0 auto 10px;height:5px;background:#fff4;border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:currentColor;border-radius:9px}
.ctl{max-width:520px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctl button{border:0;cursor:pointer;color:inherit;font:900 15px Unbounded,sans-serif;background:#fff2;border-radius:99px;padding:15px 22px}
.ctl .go{background:#fff;color:#111;flex:1;font-size:15px;padding:17px}
.ctl button:disabled{opacity:.3}.ctl button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}.disc,.sticker{animation:none!important}}
</style></head><body>

{t:"Match",by:"Pista 1",bg:"#c2255c",tc:"#fff",im:[8],L:["Fue en Tinder, sí. Esa app de mierda.","Y justo ahí estabas tú, la más hermosa.","Desde el primer día te lo dije:","cuenta conmigo, siempre."]},
{t:"60 minutos tarde",by:"Pista 2",bg:"#d9480f",tc:"#fff",im:[1],L:["Una semana de mensajes y por fin nos vemos.","Tú no llegabas. Celular apagado, sjsjsj.","Una hora esperando y yo: me dejó plantado.","Pero llegaste. Hamburguesas, y hablamos de la vida entera."]},
{t:"Negronchis",by:"Pista 3 · con mi moto",bg:"#0b7285",tc:"#fff",im:[2,3],L:["Llegó mi moto y tú la bautizaste.","Primera en subirte, primera en confiar,","con un piloto que apenas sabía manejar.","Hoy ella lleva tu nombre."]},
{t:"Novios en el lago",by:"Pista 4",bg:"#2b8a3e",tc:"#fff",im:[5],L:["Un parque, agua alrededor y mis nervios.","Te pregunté si querías ser mi novia.","Dijiste que sí.","Ahí empezó lo más bonito."]},
{t:"Mesa para dos",by:"Pista 5",bg:"#f59f00",tc:"#1d1500",im:[9],L:["Me enseñaste restaurantes que no conocía.","Pero lo mejor del menú","siempre fue la compañía."]},
{t:"Finca",by:"Pista 6 · mi cumpleaños",bg:"#1864ab",tc:"#fff",im:[4],L:["Yo esperaba algo tranquilo, nada del otro mundo.","Me hiciste un juego en Canva hermosísimo.","Y de remate, un viaje para los dos.","Nunca creí valer tanto para alguien."]},
